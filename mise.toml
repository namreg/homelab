[tools]
1password-cli = "2.42.0"
betterleaks = "1.10.1"
hk = "2.13.0"
opentofu = "1.13.10"
python = "3.13.18"
rumdl = "0.3.5"
uv = "0.13.9"

[tools."http:okf-validate"]
version = "527e81aff55992be21507e97004286789126f88c"
url = "https://raw.githubusercontent.com/open-knowledge-format/open-knowledge-format/{{ version }}/skills/okf-generate/scripts/validate.py"
checksum = "sha256:7f92df7d6a2118a5b7e5c388aa97de48f6ad31b942abc9e2fc7d344830661f49"
bin = "okf-validate"

[env]
TF_VAR_state_passphrase = "op://Homelab/Homelab OpenTofu state/password"

[task_config]
includes = [
  "mise/tasks/lint.toml",
  "mise/tasks/terraform.toml",
  "mise/tasks/proxmox.toml",
]

[tasks.check]
description = "Run all repository checks"
depends = [
  "lint:markdown",
  "lint:okf",
  "lint:secrets",
  "lint:terraform",
]
